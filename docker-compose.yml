name: dhyrium-vibecode

# Corte aislado del legacy. No incluye PostgreSQL: el backend usa la instancia
# existente de 5492 indicada por DATABASE_URL en el .env privado de la raíz.
services:
  backend:
    image: dhyrium-vibecode-backend:local
    build:
      context: ./quisvar_proyect_bk-main
      dockerfile: Dockerfile
    env_file:
      # Conserva claves de autenticación/cifrado. El archivo raíz se carga
      # después para fijar DATABASE_URL en 5492.
      - ./quisvar_proyect_bk-main/.env
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8081
      ROUTE: api/v1
      DATABASE_URL: ${DATABASE_URL}
      DOCX_RENDERER_URL: http://host.docker.internal:8092/render/docx-to-pdf
      DOCX_RENDERER_TOKEN: dhyrium-local-word-renderer-v1
      DOCX_RENDERER_REQUIRE_EXACT: "true"
    volumes:
      - "E:/backend_files_2/uploads:/app/uploads"
      - "E:/backend_files_2/public:/app/public"
      - "E:/backend_files_2/index:/app/index"
      - "E:/backend_files_2/jsonData:/app/jsonData"
    expose:
      - "8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: dhyrium-vibecode-frontend:local
    build:
      context: ./quisvar_proyect_ft-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_DHYRIUM_DESKTOP_ENABLED: "true"
        VITE_DHYRIUM_DESKTOP_DOWNLOAD_URL: "/desktop/DhyriumDesktop-0.3.3-win-x64-pilot.zip"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8002:80"
    volumes:
      # Artefacto validado de Desktop; Nginx lo sirve sin incorporarlo a la imagen.
      - "./artifacts/dhyrium-desktop:/usr/share/nginx/html/desktop:ro"
    restart: "no"
