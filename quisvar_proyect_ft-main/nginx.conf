map $uri $dhyrium_safe_request_uri {
  default $uri;
  ~^(?<dhyrium_office_prefix>.*\/task-documents\/office-edit\/)[^\/]+(?<dhyrium_office_suffix>\/.*)?$ "${dhyrium_office_prefix}[token]${dhyrium_office_suffix}";
}

map $http_referer $dhyrium_safe_referer {
  default $http_referer;
  ~^(?<dhyrium_referer_prefix>.*\/task-documents\/office-edit\/)[^\/?#]+(?<dhyrium_referer_suffix>.*)$ "${dhyrium_referer_prefix}[token]${dhyrium_referer_suffix}";
}

log_format dhyrium_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $dhyrium_safe_request_uri $server_protocol" '
                        '$status $body_bytes_sent "$dhyrium_safe_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name _;

  # No registrar tokens de sesion Word ni query strings en el access log.
  access_log /var/log/nginx/access.log dhyrium_safe;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 250m;

  # La API, Socket.IO y los archivos permanecen dentro de la red Dhyrium.
  # El navegador solo se comunica con el mismo host que sirve el frontend.
  location ~ ^/(api|socket\.io|projects|uploads|index|models|editables|reviews|task-document-assets|file-user|general|reports|images|public|api-docs|iclock)(/|$) {
    proxy_pass http://backend:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
