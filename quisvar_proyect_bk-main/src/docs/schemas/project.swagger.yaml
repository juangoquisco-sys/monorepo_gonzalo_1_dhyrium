/projects:
  get:
    tags:
      - Projects
    summary: Ver etapas
    parameters:
      - $ref: '#/components/parameters/search-project'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/page'
    description: |-
      Ver la lista de etapas
    security:
      - bearerAuth: []
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
      $ref: '#/components/responses/400'
components:
  parameters:
    id:
      name: id
      in: path
      description: Ingresar ID de la etapa
      required: true
      schema:
        type: integer
    search-project:
      name: search
      in: query
      description: Ingresar nombre o CUI del proyecto
      schema:
        type: string
    projectId:
      name: projectId
      in: query
      description: Ingresar nombre o CUI del proyecto
      schema:
        type: string
  schemas:
    duplicate:
      type: object
      properties:
        stageId:
          type: integer
          example: 1
        name:
          type: string
          example: 'nueva_etapa_duplicada'
