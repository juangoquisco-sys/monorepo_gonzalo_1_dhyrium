/payrolls:
  get:
    tags:
      - Planillas
    summary: Obtener todas las planillas
    parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/statusPayroll'
      - $ref: '#/components/parameters/isAuthorizedGrop'
      - $ref: '#/components/parameters/paymentGroup'
      - $ref: '#/components/parameters/paymentGroupFinished'
    description: Devuelve una lista de todas las planillas.
    security:
      - bearerAuth: []
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
  post:
    tags:
      - Planillas
    summary: Crear una planilla
    description: Crea una nueva planilla.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createPayroll'
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
/payrolls/{id}:
  get:
    tags:
      - Planillas
    summary: Obtener una planilla por ID
    description: Devuelve los detalles de una planilla por ID.
    parameters:
      - $ref: '#/components/parameters/payrollId'
      - $ref: '#/components/parameters/isAuthorizedGrop'
      - $ref: '#/components/parameters/paymentGroup'
      # - $ref: "#/components/parameters/paymentGroupFinished"
    security:
      - bearerAuth: []
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
/payrolls/add-report/{id}:
  post:
    tags:
      - Planillas
    summary: Añadir un reporte a una planilla
    description: Añade un nuevo reporte a una planilla.
    parameters:
      - $ref: '#/components/parameters/payrollId'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/add-report'
/payrolls/remove-report/{id}:
  delete:
    tags:
      - Planillas
    summary: Eliminar un reporte de una planilla
    description: Elimina un reporte de una planilla.
    parameters:
      - $ref: '#/components/parameters/payrollReportId'
    security:
      - bearerAuth: []
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
/payrolls/step-payment:
  put:
    tags:
      - Planillas
    summary: Mandar a pagar una planilla
    description: Mandar a pagar una planilla
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/add-report'
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
/payrolls/step-authorized-items:
  put:
    tags:
      - Planillas
    summary: autorizar reportes para dar conformidad
    description: autorizar reportes para dar conformidad
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/add-report-items'
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
/payrolls/step-authorized-group:
  put:
    tags:
      - Planillas
    summary: Dar conformidad desde gerencia/oficina
    description: Dar conformidad en la planilla por gerencia/oficina para pasar al siguiente estado
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/add-report-group'
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
/payrolls/change-status/{id}:
  patch:
    tags:
      - Planillas
    summary: Cambiar estado de la planilla
    description: Cambia el estado de la planilla para cerrarla o abrirla
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cnahge-status-payroll'
    responses:
      '200':
        $ref: '#/components/responses/200'
      '400':
        $ref: '#/components/responses/400'
components:
  schemas:
    createPayroll:
      type: object
      properties:
        pad:
          type: integer
          example: 2
    add-report:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          example:
            - { id: 2 }
            - { id: 1 }
    add-report-items:
      type: object
      required:
        - ids
        - isAuthorized
      properties:
        isAuthorized:
          type: boolean
          example: true
        ids:
          type: array
          example:
            - { id: 2 }
            - { id: 1 }
    add-report-group:
      type: object
      required:
        - officeId
        - payrollId
      properties:
        officeId:
          type: integer
          example: 2
        payrollId:
          type: integer
          example: 1
    cnahge-status-payroll:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
          example: true
    # payments:
    #   type: object
    #   required:
    #     - ids
    #   properties:
  parameters:
    payrollId:
      in: path
      name: id
      required: true
      description: ID de la nomina
      schema:
        type: integer
    payrollReportId:
      in: path
      name: id
      required: true
      description: ID del reporte
      schema:
        type: integer
    officeId:
      in: path
      name: officeId
      required: true
      description: ID de la oficina
      schema:
        type: integer
    statusPayroll:
      in: query
      name: status
      description: estado de la planilla, falso si es planilla cerrada y verdadero si es planilla abierta
      schema:
        type: boolean
    isAuthorizedGrop:
      in: query
      name: isAuthorizedGrop
      description: reportes mandados con conformidad
      schema:
        type: boolean
    paymentGroup:
      in: query
      name: paymentGroup
      description: planillas que cumplen con alugnos de los reportes mandados para pago a administración
      schema:
        type: boolean
    paymentGroupFinished:
      in: query
      name: paymentGroupFinished
      description: planilla que cumple con todos los reportes mandados para pago a administración
      schema:
        type: boolean
