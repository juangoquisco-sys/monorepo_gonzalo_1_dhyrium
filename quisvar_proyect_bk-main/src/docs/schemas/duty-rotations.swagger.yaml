        - conflictCount
        - preserved
        - removed
        - conflicts
        - preview
      properties:
        preservedCount: { type: integer, minimum: 0 }
        removedCount: { type: integer, minimum: 0 }
        regeneratedCount: { type: integer, minimum: 0 }
        conflictCount: { type: integer, minimum: 0 }
        preserved:
          type: array
          items: { $ref: '#/components/schemas/DutyImpactAssignment' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/DutyImpactAssignment' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/DutyImpactAssignment' }
        preview: { $ref: '#/components/schemas/DutyPreview' }
    DutyReconciliationConflict:
      type: object
      additionalProperties: false
      required: [assignmentId, occurrenceKey, slotKey, reason]
      properties:
        assignmentId: { type: string, format: uuid }
        occurrenceKey: { type: string }
        slotKey: { type: string }
        reason: { type: string }
    DutyReconciliationResult:
      type: object
      additionalProperties: false
      required:
        - dutyId
        - createdCount
        - preservedCount
        - deletedCount
        - conflictCount
        - createdIds
        - deletedIds
        - conflicts
      properties:
        dutyId: { type: string, format: uuid }
        createdCount: { type: integer, minimum: 0 }
        preservedCount: { type: integer, minimum: 0 }
        deletedCount: { type: integer, minimum: 0 }
        conflictCount: { type: integer, minimum: 0 }
        createdIds: { type: array, items: { type: string, format: uuid } }
        deletedIds: { type: array, items: { type: string, format: uuid } }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/DutyReconciliationConflict' }
    DutyMutationResult:
      type: object
      additionalProperties: false
      required: [duty, reconciliation, idempotentReplay]
      properties:
        duty: { $ref: '#/components/schemas/DutyRotation' }
        reconciliation:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/DutyReconciliationResult' }
        idempotentReplay: { type: boolean }
    DutyUpdateResult:
      type: object
      additionalProperties: false
      required: [duty, reconciliation, idempotentReplay]
      properties:
        duty: { $ref: '#/components/schemas/DutyRotation' }
        reconciliation:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/DutyReconciliationResult' }
        impact:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/DutyImpact' }
        idempotentReplay: { type: boolean }
    DutyStatusPreview:
      type: object
      additionalProperties: false
      required:
        [isActive, removableCount, preservedCount, conflictCount, conflicts]
      properties:
        isActive: { type: boolean }
        removableCount: { type: integer, minimum: 0 }
        preservedCount: { type: integer, minimum: 0 }
        conflictCount: { type: integer, minimum: 0 }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/DutyImpactAssignment' }
    DutyStatusMutationResult:
      type: object
      additionalProperties: false
      required: [duty, reconciliation, idempotentReplay]
      properties:
        duty: { $ref: '#/components/schemas/DutyRotation' }
        deletedCount: { type: integer, minimum: 0 }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/DutyImpactAssignment' }
        reconciliation:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/DutyReconciliationResult' }
        idempotentReplay: { type: boolean }
